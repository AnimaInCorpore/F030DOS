# Drive the original far enough to use its own screenshot key, so a frame it
# drew can be diffed against this port's - see tools/compare-terrain.py.
#
#   dosbox-staging --noprimaryconfig --nolocalconf --conf tools/dosbox/oracle.conf
#
# The C: drive is a scratch COPY of the installed tree: the game writes
# SNAP_nnn.PCX beside its own files and the asset tree must stay clean.
[sdl]
output = texture
fullscreen = false
[render]
aspect = false
glshader = none
[dosbox]
machine = svga_s3
memsize = 16
[cpu]
core = auto
cpu_cycles = 20000
[mixer]
nosound = true
[capture]
capture_dir = /private/tmp/claude-501/-Users-saschaspringer-Work-F030Comanche/be9f9c74-d574-43e8-8b80-9a80e1b5f63e/scratchpad/shots
# raw is the native VGA frame - what the game actually drew, unscaled and
# unfiltered - which is the only form comparable with a Falcon capture.
default_image_capture_formats = raw
[autoexec]
mount c /private/tmp/claude-501/-Users-saschaspringer-Work-F030Comanche/be9f9c74-d574-43e8-8b80-9a80e1b5f63e/scratchpad/cdrive
c:
c:\COMANCHE.EXE
