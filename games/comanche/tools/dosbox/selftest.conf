# Proves the TSR works, independently of any game.
#
#   dosbox-staging --noprimaryconfig --nolocalconf --conf tools/dosbox/selftest.conf
#
# MODE13.COM sets mode 13h, writes (63,21,42) into DAC entry 1, waits five
# seconds and exits. PAL.BIN should appear in the game directory with that
# value at entry 1. It does - which is what establishes that the capture
# failing under Comanche is Comanche's doing, not the tool's.
[sdl]
output = texture
fullscreen = false
[render]
aspect = false
glshader = none
[dosbox]
machine = svga_s3
memsize = 16
[cpu]
core = auto
cpu_cycles = 20000
[mixer]
nosound = true
[autoexec]
mount c ./assets/extracted/comanche_hdd
mount d ./tools/dosbox
c:
copy d:\PALTSR.COM c:\ > nul
copy d:\MODE13.COM c:\ > nul
c:\PALTSR.COM
c:\MODE13.COM
exit
