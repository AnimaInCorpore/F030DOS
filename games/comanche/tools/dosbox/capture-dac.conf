# Capture the palette Comanche has in the VGA DAC WHILE IT RUNS.
#
#   dosbox-staging --noprimaryconfig --nolocalconf --conf tools/dosbox/capture-dac.conf
#
# The session installs PALTSR, runs the game, and runs PALTSR again afterwards.
# Play until the flight view is on screen, then quit the game so you land back
# at the DOS prompt. Do not close the DOSBox window while the game is running -
# the lines after it would never run.
#
# Reading the DAC after the game exits does not work: returning to text mode
# resets it. PALTSR instead hooks the timer tick and copies the DAC into a
# resident buffer about once a second, but only while the BIOS video mode byte
# reads 13h. Text mode leaves the buffer untouched, so what it holds at the end
# is the last palette the game had.
#
# Then:
#   python3 tools/compare-dac.py tools/dosbox/PAL.BIN
[sdl]
output = texture
fullscreen = false
[render]
aspect = false
glshader = none
[dosbox]
machine = svga_s3
memsize = 16
[cpu]
core = auto
cpu_cycles = 20000
[autoexec]
mount c ./assets/extracted/comanche_hdd
mount d ./tools/dosbox
c:
copy d:\PALTSR.COM c:\ > nul
c:\PALTSR.COM
c:\COMANCHE.EXE
c:\PALTSR.COM
copy c:\PAL.BIN d:\PAL.BIN > nul
del c:\PALTSR.COM > nul
del c:\PAL.BIN > nul
echo.
echo PAL.BIN written to tools/dosbox - now run:
echo   python3 tools/compare-dac.py tools/dosbox/PAL.BIN
pause
